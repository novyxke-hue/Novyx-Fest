<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

.container{
    width:90%;
    max-width:1150px;
    margin:auto;
}

/* NAVIGATION */

nav{
    height:80px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #222;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:7px;
}

.nav-links{
    display:flex;
    gap:30px;
    color:#aaa;
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
}

.nav-links a:hover{
    color:#fff;
}

/* HERO */

.hero{
    min-height:720px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    overflow:hidden;
}

.hero::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    border:1px solid #242424;
    border-radius:50%;
}

.hero::after{
    content:"";
    position:absolute;
    width:750px;
    height:750px;
    border:1px solid #151515;
    border-radius:50%;
}

.hero-content{
    position:relative;
    z-index:2;
}

.kicker{
    color:#888;
    font-size:11px;
    letter-spacing:6px;
    text-transform:uppercase;
}

.hero h1{
    font-size:clamp(65px,15vw,170px);
    letter-spacing:16px;
    line-height:.8;
    margin:30px 0;
    font-weight:1000;
}

.event-date{
    font-size:17px;
    letter-spacing:4px;
    font-weight:bold;
}

.location{
    color:#888;
    margin:12px 0 35px;
    letter-spacing:2px;
}

.button{
    display:inline-block;
    padding:16px 30px;
    background:#fff;
    color:#000;
    font-size:12px;
    font-weight:900;
    letter-spacing:2px;
    border-radius:4px;
    transition:.2s;
}

.button:hover{
    transform:translateY(-3px);
}

.button.dark{
    background:#111;
    color:#fff;
    border:1px solid #444;
    margin-left:8px;
}

/* MOVING BAR */

.ticker{
    border-top:1px solid #222;
    border-bottom:1px solid #222;
    padding:18px 0;
    color:#777;
    font-size:11px;
    letter-spacing:5px;
    white-space:nowrap;
    overflow:hidden;
}

/* SECTIONS */

section{
    padding:95px 0;
}

.section-header{
    display:flex;
    justify-content:space-between;
    gap:40px;
    align-items:end;
    margin-bottom:40px;
}

.eyebrow{
    color:#777;
    font-size:11px;
    letter-spacing:4px;
}

h2{
    font-size:45px;
    margin-top:10px;
    letter-spacing:-2px;
}

.description{
    max-width:470px;
    color:#999;
    line-height:1.8;
}

/* ABOUT */

.about-box{
    border:1px solid #282828;
    padding:60px 30px;
    text-align:center;
    background:linear-gradient(135deg,#121212,#070707);
}

.about-box h3{
    font-size:45px;
    margin-bottom:15px;
}

.about-box p{
    color:#999;
    margin-bottom:30px;
}

/* TICKETS */

.ticket-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.ticket{
    min-height:210px;
    border:1px solid #262626;
    background:linear-gradient(145deg,#151515,#080808);
    padding:25px;
    transition:.25s;
}

.ticket:hover{
    transform:translateY(-6px);
    border-color:#666;
}

.ticket-label{
    color:#777;
    font-size:10px;
    letter-spacing:3px;
}

.ticket h3{
    margin:25px 0 10px;
    font-size:19px;
}

.price{
    font-size:32px;
    font-weight:900;
}

.ticket-note{
    color:#666;
    font-size:11px;
    margin-top:15px;
}

/* LINEUP */

.lineup{
    display:grid;
    grid-template-columns:repeat(3,1fr);

}
